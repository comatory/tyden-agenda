name: Checks

on: push

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Build
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
